[package]
name = "validator-lab"
version = "0.0.1"
authors = ["Solana Labs Maintainers <maintainers@solanalabs.com>"]
repository = "https://https://github.com/anza-xyz/validator-lab"
homepage = "https://anza.xyz/"
license = "Apache-2.0"
edition = "2021"

[dependencies]
bzip2 = "0.4.4"
clap = { version = "3.2.22", features = ["cargo"] }
console = "0.15.8"
git2 = "0.18.3"
indicatif = "0.17.8"
k8s-openapi ={ version = "0.20.0", features = ["v1_28"] }
kube = "0.87.2"
log = "0.4.21"
openssl = "0.10.66"
rand = "0.8.5"
reqwest = { version = "0.11.23", features = ["blocking", "brotli", "deflate", "gzip", "rustls-tls", "json"] }
rustls = { version = "0.21.11", default-features = false, features = ["quic"] }
serde = "1.0.208"
serde_yaml = "0.9.34"
solana-accounts-db = "2.1.9"
solana-clap-v3-utils = "2.1.9"
solana-core = "2.1.9"
solana-genesis = "2.1.9"
solana-ledger = "2.1.9"
solana-logger = "2.1.9"
solana-sdk = "2.1.9"
solana-program = "2.1.9"
strum = "0.26.2"
strum_macros = "0.26.2"
subtle = "2.4.1"
tar = "0.4.40"
tokio = { version = "1.29.1", features = ["full"] }
url = "2.5.0"
# See "zeroize versioning issues" below if you are updating this version.
zeroize = { version = "1.3", default-features = false }

[build-dependencies]
rustc_version = "0.4"

[[bin]]
name = "cluster"
path = "src/main.rs"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]
